<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.VM.Name}} · terminal · vmm</title>
    <link rel="preload" href="/static/fonts/azeret-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="term-page">
    <div class="term-bar">
        <a href="/vms/{{.VM.Name}}">← {{.VM.Name}}</a>
        <span class="sep"></span>
        <span class="term-target"><span class="tok-cmd">vmm ssh</span> <span class="tok-data">{{.VM.Name}}</span> <span class="muted"># {{.VM.IPAddress}}</span></span>
        <span class="term-state">
            <span id="terminal-status" class="terminal-status status-connecting"></span>
            <span id="terminal-status-text">connecting…</span>
        </span>
    </div>
    <div id="terminal-container" data-vm-name="{{.VM.Name}}"></div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <script src="/static/terminal.js"></script>
</body>
</html>
