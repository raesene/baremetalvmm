<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} · {{end}}vmm</title>
    <link rel="preload" href="/static/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/azeret-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
    <meta name="csrf-token" content="{{.CSRFToken}}">
</head>
<body>
<div class="shell">
    <aside class="rail">
        <a href="/dashboard" class="brand">
            <span class="brand-glyph">&gt;_</span>
            <span>
                <span class="brand-name">vmm</span>
                <span class="brand-sub">microvm console</span>
            </span>
        </a>

        <div class="rail-label">Operate</div>
        <nav class="rail-nav">
            <a href="/dashboard" class="{{if eq .Active "dashboard"}}is-active{{end}}">Overview <span class="rail-cmd">status</span></a>
            <a href="/vms" class="{{if eq .Active "vms"}}is-active{{end}}">Virtual machines <span class="rail-cmd">list</span></a>
            <a href="/clusters" class="{{if eq .Active "clusters"}}is-active{{end}}">Clusters <span class="rail-cmd">cluster</span></a>
            <a href="/images" class="{{if eq .Active "images"}}is-active{{end}}">Images &amp; kernels <span class="rail-cmd">image</span></a>
        </nav>

        <div class="rail-label">System</div>
        <nav class="rail-nav">
            <a href="/api-key" class="{{if eq .Active "api-key"}}is-active{{end}}">API access <span class="rail-cmd">api</span></a>
            <a href="/config" class="{{if eq .Active "config"}}is-active{{end}}">Configuration <span class="rail-cmd">config</span></a>
        </nav>

        <div class="rail-foot">
            <div class="rail-status" id="event-status"><span class="dot"></span><span id="event-status-text">event stream idle</span></div>
            {{if .Update}}<a href="/config#version" class="rail-update">v{{.Update.Version}} available</a>{{end}}
            <form method="POST" action="/logout">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
            </form>
        </div>
    </aside>

    <main class="main">
        <div class="main-inner">
            {{if .Flash}}
            <div class="flash flash-{{.FlashType}}" id="flash">{{.Flash}}</div>
            {{end}}
            {{template "content" .}}
        </div>
    </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
