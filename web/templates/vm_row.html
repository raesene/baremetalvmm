<tr id="vm-row-{{.Name}}" data-vm="{{.Name}}">
    <td>
        <a href="/vms/{{.Name}}" class="id-name">{{.Name}}</a>
        <span class="id-sub">{{.ID}}</span>
    </td>
    <td><span class="chip chip-{{.State}}" data-state><span class="dot"></span><span data-state-label>{{.State}}</span></span></td>
    <td class="num">{{.CPUs}}</td>
    <td class="num">{{.MemoryMB}}<span class="muted"> MB</span></td>
    <td class="data">{{if .IPAddress}}{{.IPAddress}}{{else}}<span class="muted">—</span>{{end}}</td>
    <td class="muted">{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
    <td class="right">
        <span class="row-actions">
            {{if eq (printf "%s" .State) "running"}}
            <a href="/vms/{{.Name}}/terminal" class="act">ssh</a>
            <button hx-post="/vms/{{.Name}}/stop" hx-target="#vm-row-{{.Name}}" hx-swap="outerHTML" class="act">stop</button>
            {{else if or (eq (printf "%s" .State) "stopped") (eq (printf "%s" .State) "created")}}
            <button hx-post="/vms/{{.Name}}/start" hx-target="#vm-row-{{.Name}}" hx-swap="outerHTML" class="act">start</button>
            {{end}}
            <button hx-delete="/vms/{{.Name}}" hx-target="#vm-row-{{.Name}}" hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete VM '{{.Name}}'?"
                class="act act-danger">delete</button>
        </span>
    </td>
</tr>
