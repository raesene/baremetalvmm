<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · vmm</title>
    <link rel="preload" href="/static/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/azeret-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth">
    <div class="auth-form">
        <div class="brand">
            <span class="brand-glyph">&gt;_</span>
            <span>
                <span class="brand-name">vmm</span>
                <span class="brand-sub">microvm console</span>
            </span>
        </div>

        <h1>Every VM is a line<br>you can <em>read back.</em></h1>
        <p class="lede">Bare-metal Firecracker microVMs and clusters, managed from one console.</p>

        <section class="panel auth-card">
            <div class="panel-head">
                <div><span class="hw">auth / session</span><h2>Sign in</h2></div>
            </div>
            <form method="POST" action="/login" class="panel-body">
                {{if .Error}}
                <div class="notice notice-error"><span>{{.Error}}</span></div>
                {{end}}
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="admin" readonly class="input">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autofocus required class="input">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>
        </section>

        <p class="auth-foot">vmm-web · bare metal microvm manager</p>
    </div>
    <div class="auth-art" role="img" aria-label="Illustration of a bare-metal server with a stack of microVMs rising from it"></div>
</div>
</body>
</html>
